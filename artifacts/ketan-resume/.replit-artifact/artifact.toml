kind = "web"
previewPath = "/"
title = "Ketan Bhoi — IT Recruiter & AI Web Developer"
description = "A fact-grounded portfolio with equal career focus on IT recruitment and AI-assisted web development using prompt engineering, with multilingual public evidence and private career-preparation tools."
version = "1.0.0"
id = "artifacts/ketan-resume"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19832

[services.development]
run = "pnpm --filter @workspace/ketan-resume run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ketan-resume", "run", "build" ]
serve = "static"
publicDir = "artifacts/ketan-resume/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19832"
BASE_PATH = "/"
