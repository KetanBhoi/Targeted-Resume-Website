openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ambassador
    description: Evidence-grounded candidate questions
  - name: workspace
    description: Private candidate workspace records and preparation tools
  - name: portfolio
    description: Public portfolio content and owner editing
paths:
  /portfolio/content:
    get:
      operationId: getPublicPortfolioContent
      tags: [portfolio]
      summary: Get only approved, published portfolio content
      responses:
        "200":
          description: Public-safe portfolio content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioContent"
        "503":
          description: Portfolio content is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portfolio/content/owner:
    get:
      operationId: getOwnerPortfolioContent
      tags: [portfolio]
      summary: Get the complete portfolio content document for the verified owner
      responses:
        "200":
          description: Full portfolio content including drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioContent"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Owner check or content storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateOwnerPortfolioContent
      tags: [portfolio]
      summary: Replace the complete portfolio content document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioContentInput"
      responses:
        "200":
          description: Updated complete portfolio content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioContent"
        "400":
          description: Invalid portfolio content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Owner check or content storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portfolio/feedback:
    post:
      operationId: submitPortfolioFeedback
      tags: [portfolio]
      summary: Send a private recruiter note to the portfolio owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioFeedbackInput"
      responses:
        "201":
          description: Note received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioFeedbackReceipt"
        "400":
          description: Invalid note
        "429":
          description: Too many submissions
        "503":
          description: Feedback is temporarily unavailable
    get:
      operationId: listPortfolioFeedback
      tags: [portfolio]
      summary: List the newest 100 notes, only for the verified portfolio owner
      responses:
        "200":
          description: Private feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioFeedback"
        "401":
          description: Sign in required
        "403":
          description: Owner access required
        "503":
          description: Feedback unavailable
  /portfolio/owner-access:
    get:
      operationId: getPortfolioOwnerAccess
      tags: [portfolio]
      summary: Check the signed-in account against the verified owner email
      responses:
        "200":
          description: Access result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioOwnerAccess"
        "401":
          description: Sign in required
        "503":
          description: Owner check unavailable
  /portfolio/feedback/{id}:
    delete:
      operationId: deletePortfolioFeedback
      tags: [portfolio]
      summary: Delete a note, only for the verified portfolio owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Deleted
        "401":
          description: Sign in required
        "403":
          description: Owner access required
        "404":
          description: Note not found
        "503":
          description: Feedback unavailable
  /portfolio/case-studies:
    get:
      operationId: listPublicCaseStudies
      tags: [portfolio]
      summary: List published fictional practice case studies
      responses:
        "200":
          description: Public-safe case studies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicCaseStudy" }
  /portfolio/case-studies/owner:
    get:
      operationId: listOwnerCaseStudies
      tags: [portfolio]
      summary: List private case studies for the verified owner
      responses:
        "200":
          description: Owner case studies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerCaseStudy" }
        "401": { description: Sign in required }
        "403": { description: Owner access required }
    post:
      operationId: createCaseStudy
      tags: [portfolio]
      summary: Create an owner-reviewed case study from a private simulation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseStudyInput" }
      responses:
        "201":
          description: Created case study
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerCaseStudy" }
        "400": { description: Invalid or insufficiently reviewed case study }
        "401": { description: Sign in required }
        "403": { description: Owner access required }
        "404": { description: Source simulation not found }
  /portfolio/case-studies/owner/{id}:
    patch:
      operationId: updateCaseStudy
      tags: [portfolio]
      summary: Replace reviewed case study fields for the verified owner
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseStudyUpdate" }
      responses:
        "200":
          description: Updated case study
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerCaseStudy" }
        "400": { description: Invalid case study }
        "401": { description: Sign in required }
        "403": { description: Owner access required }
        "404": { description: Case study not found }
    delete:
      operationId: deleteCaseStudy
      tags: [portfolio]
      summary: Delete a case study for the verified owner
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { description: Sign in required }
        "403": { description: Owner access required }
        "404": { description: Case study not found }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ambassador/answer:
    post:
      operationId: askAmbassador
      tags: [ambassador]
      summary: Ask the candidate ambassador a question
      description: Answers using only the candidate's verified public resume facts. Chat content is not persisted or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmbassadorQuestionInput"
      responses:
        "200":
          description: Grounded answer or an unsupported-information refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmbassadorAnswer"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Ambassador temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace/records:
    get:
      operationId: listWorkspaceRecords
      tags: [workspace]
      summary: List the signed-in user's saved workspace records
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkspaceRecordKind"
      responses:
        "200":
          description: Workspace records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWorkspaceRecord
      tags: [workspace]
      summary: Save a workspace record
      description: Application packs cannot be created through this generic endpoint; use POST /workspace/packs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRecordInput"
      responses:
        "201":
          description: Saved record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecord"
        "400":
          description: Invalid record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace/export:
    get:
      operationId: exportWorkspaceData
      tags: [workspace]
      summary: Export the signed-in user's current workspace records
      responses:
        "200":
          description: Fresh export of the signed-in user's records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExport"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace/delete-all:
    post:
      operationId: deleteAllWorkspaceRecords
      tags: [workspace]
      summary: Atomically delete all records owned by the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceDeleteAllInput"
      responses:
        "200":
          description: Number of records deleted for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeleteAllResult"
        "400":
          description: Exact deletion confirmation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace/records/{id}:
    patch:
      operationId: updateWorkspaceRecord
      tags: [workspace]
      summary: Update one of the signed-in user's records
      description: Immutable application pack snapshots cannot be updated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRecordUpdate"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteWorkspaceRecord
      tags: [workspace]
      summary: Delete one of the signed-in user's records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Record deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace/generate:
    post:
      operationId: generateWorkspaceContent
      tags: [workspace]
      summary: Generate and save analysis or career preparation content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceGenerationInput"
      responses:
        "201":
          description: Generated and saved workspace record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceGenerationRecord"
        "400":
          description: Invalid generation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Content generation is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: A linked record is missing, belongs to another user, or has the wrong kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace/packs:
    post:
      operationId: createApplicationPack
      tags: [workspace]
      summary: Create an immutable reviewed application snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationPackInput" }
      responses:
        "201":
          description: Immutable pack record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationPackRecord" }
        "400": { description: Invalid input or review confirmation }
        "401": { description: Authentication required }
        "404": { description: Source record not found }
        "409": { description: Source resume needs fact review }
  /application-shares:
    get:
      operationId: listApplicationShares
      tags: [workspace]
      summary: List the signed-in user's share records without secrets or snapshots
      responses:
        "200":
          description: Owned shares
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationShare" }
        "401": { description: Authentication required }
    post:
      operationId: createApplicationShare
      tags: [workspace]
      summary: Create a time-limited, revocable share for an owned pack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationShareInput" }
      responses:
        "201":
          description: Share and one-time bearer token (never returned again)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApplicationShare" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "404": { description: Pack not found }
  /application-shares/resolve:
    post:
      operationId: resolveApplicationShare
      tags: [workspace]
      summary: Resolve a bearer token without placing it in a URL
      description: Responses are not cached/indexed; request bodies and tokens must never be logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareTokenInput" }
      responses:
        "200":
          description: Public share snapshot
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Robots-Tag: { schema: { type: string, const: "noindex, nofollow, noarchive" } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedApplicationShare" }
        "400": { description: Invalid token format }
        "404": { description: Invalid or missing share }
        "410": { description: Revoked or expired share }
        "429": { description: Resolver rate limit exceeded }
  /application-shares/{id}:
    delete:
      operationId: revokeApplicationShareById
      tags: [workspace]
      summary: Revoke an owned share without revealing cross-owner existence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "401": { description: Authentication required }
        "404": { description: Share not found }
components:
  schemas:
    PortfolioFeedbackInput:
      type: object
      properties:
        roleView:
          type: string
          enum: [recruiter, hiring-manager, technical]
        signal:
          type: string
          enum: [strong-fit, explore, needs-evidence]
        message:
          type: string
          minLength: 10
          maxLength: 1200
        website:
          type: string
          maxLength: 120
          description: Anti-spam field; must be empty.
      required: [roleView, signal, message]
    PortfolioFeedbackReceipt:
      type: object
      properties:
        received:
          type: boolean
      required: [received]
    PortfolioFeedback:
      type: object
      properties:
        id:
          type: integer
        roleView:
          type: string
          enum: [recruiter, hiring-manager, technical]
        signal:
          type: string
          enum: [strong-fit, explore, needs-evidence]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, roleView, signal, message, createdAt]
    PortfolioOwnerAccess:
      type: object
      properties:
        isOwner:
          type: boolean
      required: [isOwner]
    PortfolioBooking:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        url: { type: string, maxLength: 2048, default: "" }
        timezone: { type: string, minLength: 1, maxLength: 100, default: Asia/Kolkata }
        availability: { type: string, maxLength: 2000, default: "" }
      required: [enabled, url, timezone, availability]
    PortfolioAvailability:
      type: object
      properties:
        published: { type: boolean, default: false }
        roles: { type: string, maxLength: 2000, default: "" }
        workArrangement: { type: string, maxLength: 1000, default: "" }
        locations: { type: string, maxLength: 1000, default: "" }
        joining: { type: string, maxLength: 1000, default: "" }
      required: [published, roles, workArrangement, locations, joining]
    PortfolioCertificate:
      type: object
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, maxLength: 200 }
        issuer: { type: string, maxLength: 200 }
        completed: { type: string, maxLength: 10, description: YYYY-MM-DD when published }
        verificationUrl: { type: string, maxLength: 2048, description: Optional blank or HTTPS URL }
        published: { type: boolean }
      required: [id, title, issuer, completed, verificationUrl, published]
    PortfolioRecommendation:
      type: object
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        author: { type: string, maxLength: 160 }
        relationship: { type: string, maxLength: 160 }
        text: { type: string, maxLength: 3000 }
        consent: { type: boolean }
        approved: { type: boolean }
        published: { type: boolean }
      required: [id, author, relationship, text, consent, approved, published]
    PortfolioContentInput:
      type: object
      properties:
        booking:
          $ref: "#/components/schemas/PortfolioBooking"
        availability:
          $ref: "#/components/schemas/PortfolioAvailability"
        certificates:
          type: array
          maxItems: 30
          default: []
          items:
            $ref: "#/components/schemas/PortfolioCertificate"
        recommendations:
          type: array
          maxItems: 30
          default: []
          items:
            $ref: "#/components/schemas/PortfolioRecommendation"
      required: [booking, availability, certificates, recommendations]
    PortfolioContent:
      allOf:
        - $ref: "#/components/schemas/PortfolioContentInput"
        - type: object
          properties:
            updatedAt:
              type: ["string", "null"]
              format: date-time
          required: [updatedAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AmbassadorQuestionInput:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 600
      required:
        - question
    AmbassadorAnswer:
      type: object
      properties:
        answer:
          type: string
        section:
          type: [string, "null"]
          enum: [about, role-fit, experience, projects, skills, education, null]
      required:
        - answer
        - section
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    WorkspaceRecordKind:
      type: string
      enum: [resume, job, analysis, interview, cover-letter, linkedin, follow-up, simulation, practice, research, network, offer, pack]
    WorkspaceRecordCreateKind:
      type: string
      enum: [resume, job, analysis, interview, cover-letter, linkedin, follow-up, simulation, practice, research, network, offer]
    WorkspaceRecord:
      type: object
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/WorkspaceRecordKind"
        title:
          type: string
        content:
          type: string
        metadata:
          $ref: "#/components/schemas/WorkspaceRecordMetadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, kind, title, content, metadata, createdAt, updatedAt]
    WorkspaceExport:
      type: object
      properties:
        exportedAt:
          type: string
          format: date-time
        records:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRecord"
      required: [exportedAt, records]
    WorkspaceDeleteAllInput:
      type: object
      properties:
        confirmation:
          type: string
          enum: ["DELETE ALL"]
      required: [confirmation]
    WorkspaceDeleteAllResult:
      type: object
      properties:
        deletedCount:
          type: integer
          minimum: 0
      required: [deletedCount]
    WorkspaceRecordInput:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/WorkspaceRecordCreateKind"
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          maxLength: 50000
        metadata:
          $ref: "#/components/schemas/WorkspaceRecordMetadata"
      required: [kind, title, content]
    WorkspaceRecordUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          maxLength: 50000
        metadata:
          $ref: "#/components/schemas/WorkspaceRecordMetadata"
    WorkspaceGenerationInput:
      type: object
      description: >
        resumeText is required for all generation kinds except follow-up.
        For resume-tailor, sourceResumeId and a job description are required.
        For follow-up, sourceJobId is required. Supplied source IDs must
        reference records owned by the authenticated user and of the expected kind.
        questionCategory is only used for interviews; batchId is only used for analyses.
      properties:
        kind:
          type: string
          enum: [analysis, interview, cover-letter, linkedin, resume-tailor, follow-up]
        title:
          type: string
          minLength: 1
          maxLength: 160
        resumeText:
          type: string
          minLength: 1
          maxLength: 20000
          description: Required for every kind except follow-up.
        jobDescription:
          type: string
          maxLength: 20000
        instructions:
          type: string
          maxLength: 2000
        sourceResumeId:
          type: integer
          minimum: 1
          description: Optional link to a saved resume record owned by the signed-in user.
        sourceJobId:
          type: integer
          minimum: 1
          description: Optional link to a tracked job record owned by the signed-in user.
        batchId:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional shared identifier for analyses in the same multi-job comparison.
        questionCategory:
          $ref: "#/components/schemas/WorkspaceInterviewQuestionCategory"
      required: [kind, title]
    WorkspaceRecordMetadata:
      type: object
      description: >
        Extensible kind-specific data. Generated analysis, tailored resume,
        follow-up, and interview records use their corresponding typed schemas.
      additionalProperties: true
    WorkspaceSimulationMetadata:
      type: object
      properties:
        scenarioId: { type: string, minLength: 1, maxLength: 120 }
        stage: { type: string, minLength: 1, maxLength: 80 }
      required: [scenarioId, stage]
    WorkspacePracticeMetadata:
      type: object
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        category: { type: string, minLength: 1, maxLength: 80 }
        duration: { type: integer, minimum: 1, maximum: 1440 }
        checks:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: boolean }
        reflection: { type: string, maxLength: 5000 }
      required: [question, category, duration, checks, reflection]
    WorkspaceAnalysisMetadata:
      type: object
      properties:
        fitScore:
          type: integer
          minimum: 0
          maximum: 100
        strengths:
          type: array
          items:
            type: string
        skillGaps:
          type: array
          items:
            type: string
        atsIssues:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        recommendation:
          type: string
        roadmap:
          type: array
          description: Actionable next steps for skills identified as missing from the resume.
          items:
            $ref: "#/components/schemas/WorkspaceRoadmapItem"
        keywordHeatmap:
          type: array
          description: Deterministic, case-insensitive exact-term counts in the supplied job description and resume.
          items:
            $ref: "#/components/schemas/WorkspaceKeywordHeatmapEntry"
        sourceResumeId:
          type: integer
          minimum: 1
        sourceJobId:
          type: integer
          minimum: 1
        batchId:
          type: string
          minLength: 1
          maxLength: 100
      required: [fitScore, strengths, skillGaps, atsIssues, keywords, recommendation, roadmap, keywordHeatmap]
    WorkspaceTailoredResumeMetadata:
      type: object
      description: Complete before/after document comparison for a tailored resume that must be reviewed before use.
      properties:
        sourceResumeId:
          type: integer
          minimum: 1
        sourceJobId:
          type: integer
          minimum: 1
        changes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkspaceResumeChange"
        verificationStatus:
          type: string
          enum: [needs-review]
      required: [sourceResumeId, changes, verificationStatus]
    WorkspaceFollowUpMetadata:
      type: object
      description: Follow-up email subject, notes, and tracked application link.
      properties:
        subject:
          type: string
        notes:
          type: array
          items:
            type: string
        sourceJobId:
          type: integer
          minimum: 1
        sourceResumeId:
          type: integer
          minimum: 1
      required: [subject, notes, sourceJobId]
    WorkspaceRoadmapItem:
      type: object
      properties:
        skill:
          type: string
        requirement:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        firstStep:
          type: string
      required: [skill, requirement, priority, firstStep]
    WorkspaceInterviewQuestionCategory:
      type: string
      enum: [HR, Technical, Resume, JD, STAR]
    WorkspaceInterviewQuestion:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/WorkspaceInterviewQuestionCategory"
        question:
          type: string
        suggestedAnswerPoints:
          type: array
          minItems: 1
          items:
            type: string
      required: [category, question, suggestedAnswerPoints]
    WorkspaceInterviewMetadata:
      type: object
      properties:
        questionCategory:
          $ref: "#/components/schemas/WorkspaceInterviewQuestionCategory"
        sourceResumeId:
          type: integer
          minimum: 1
        sourceJobId:
          type: integer
          minimum: 1
        questions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkspaceInterviewQuestion"
        questionsToAsk:
          type: array
          items:
            type: string
      required: [questions, questionsToAsk]
    WorkspaceResearchMetadata:
      type: object
      additionalProperties: false
      properties:
        companyName: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, maxLength: 200 }
        sources:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/ResearchSource" }
        questions:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 2000 }
        reasons:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 2000 }
      required: [companyName, role, sources, questions, reasons]
    ResearchSource:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 200 }
        url: { type: string, maxLength: 2048, pattern: "^$|^https://" }
        checkedOn: { type: string, maxLength: 10, pattern: "^$|^\\d{4}-\\d{2}-\\d{2}$" }
      required: [label, url, checkedOn]
    WorkspaceNetworkMetadata:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        organization: { type: string, maxLength: 200 }
        role: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 320, pattern: "^$|^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$" }
        profileUrl: { type: string, maxLength: 2048, pattern: "^$|^https://" }
        lastContact: { type: string, maxLength: 10, pattern: "^$|^\\d{4}-\\d{2}-\\d{2}$" }
        nextFollowUp: { type: string, maxLength: 10, pattern: "^$|^\\d{4}-\\d{2}-\\d{2}$" }
        status: { type: string, enum: [planned, contacted, replied, paused] }
      required: [name, organization, role, email, profileUrl, lastContact, nextFollowUp, status]
    WorkspaceOfferMetadata:
      type: object
      additionalProperties: false
      properties:
        company: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, maxLength: 200 }
        currency: { type: string, enum: [INR, USD, EUR, GBP, CAD, AUD] }
        annualSalary: { type: ["number", "null"], minimum: 0 }
        annualBonus: { type: ["number", "null"], minimum: 0 }
        hoursPerWeek: { type: ["number", "null"], exclusiveMinimum: 0 }
        location: { type: string, maxLength: 200 }
        arrangement: { type: string, maxLength: 100 }
        benefits: { type: string, maxLength: 5000 }
        ratings: { $ref: "#/components/schemas/OfferRatings" }
      required: [company, role, currency, annualSalary, annualBonus, hoursPerWeek, location, arrangement, benefits, ratings]
    OfferRatings:
      type: object
      additionalProperties: false
      properties:
        salary: { type: integer, minimum: 1, maximum: 5 }
        benefits: { type: integer, minimum: 1, maximum: 5 }
        location: { type: integer, minimum: 1, maximum: 5 }
        hours: { type: integer, minimum: 1, maximum: 5 }
        growth: { type: integer, minimum: 1, maximum: 5 }
      required: [salary, benefits, location, hours, growth]
    WorkspacePackMetadata:
      type: object
      additionalProperties: false
      properties:
        reviewed: { type: boolean, const: true }
        resumeId: { type: integer, minimum: 1 }
        coverLetterId: { type: ["integer", "null"], minimum: 1 }
      required: [reviewed, resumeId, coverLetterId]
    ApplicationPackRecord:
      allOf:
        - $ref: "#/components/schemas/WorkspaceRecord"
        - type: object
          properties:
            kind: { type: string, const: pack }
            metadata: { $ref: "#/components/schemas/WorkspacePackMetadata" }
          required: [kind, metadata]
    ApplicationPackInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        resumeId: { type: integer, minimum: 1 }
        coverLetterId: { type: ["integer", "null"], minimum: 1 }
        brief: { type: string, minLength: 1, maxLength: 10000, pattern: ".*\\S.*" }
        links:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/ApplicationPackLink" }
        reviewConfirmed: { type: boolean }
      required: [title, resumeId, coverLetterId, brief, links, reviewConfirmed]
    ApplicationPackLink:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 200 }
        url: { type: string, maxLength: 2048, pattern: "^https://" }
      required: [label, url]
    ApplicationPackSnapshot:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        resume:
          type: object
          additionalProperties: false
          properties: { title: { type: string }, content: { type: string } }
          required: [title, content]
        coverLetter:
          type: ["object", "null"]
          additionalProperties: false
          properties: { title: { type: string }, content: { type: string } }
          required: [title, content]
        brief: { type: string }
        links:
          type: array
          items: { $ref: "#/components/schemas/ApplicationPackLink" }
        createdAt: { type: string, format: date-time }
      required: [title, resume, coverLetter, brief, links, createdAt]
    ApplicationShareInput:
      type: object
      additionalProperties: false
      properties:
        packId: { type: integer, minimum: 1 }
        expiresInDays: { type: integer, enum: [1, 7, 14, 30] }
        sharingConfirmed: { type: boolean }
      required: [packId, expiresInDays, sharingConfirmed]
    ApplicationShare:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        packRecordId: { type: integer, minimum: 1 }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
      required: [id, packRecordId, title, createdAt, expiresAt, revokedAt]
    CreatedApplicationShare:
      type: object
      additionalProperties: false
      properties:
        share: { $ref: "#/components/schemas/ApplicationShare" }
        token:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: One-time bearer secret. Store securely; it is not returned by list endpoints.
      required: [share, token]
    ShareTokenInput:
      type: object
      additionalProperties: false
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      required: [token]
    ResolvedApplicationShare:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        expiresAt: { type: string, format: date-time }
        pack: { $ref: "#/components/schemas/ApplicationPackSnapshot" }
      required: [title, expiresAt, pack]
    CaseStudyInput:
      type: object
      additionalProperties: false
      properties:
        simulationId: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 3000 }
        jobDescription: { type: string, maxLength: 10000 }
        outreach: { type: string, maxLength: 5000 }
        reasoning: { type: string, maxLength: 10000 }
        lessons: { type: string, maxLength: 5000 }
        fictionalConfirmed: { type: boolean }
        published: { type: boolean }
      required: [simulationId, title, summary, jobDescription, outreach, reasoning, lessons, fictionalConfirmed, published]
    CaseStudyUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 3000 }
        jobDescription: { type: string, maxLength: 10000 }
        outreach: { type: string, maxLength: 5000 }
        reasoning: { type: string, maxLength: 10000 }
        lessons: { type: string, maxLength: 5000 }
        fictionalConfirmed: { type: boolean }
        published: { type: boolean }
      required: [title, summary, jobDescription, outreach, reasoning, lessons, fictionalConfirmed, published]
    OwnerCaseStudy:
      allOf:
        - $ref: "#/components/schemas/CaseStudyInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id, createdAt, updatedAt]
    PublicCaseStudy:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string }
        jobDescription: { type: string }
        outreach: { type: string }
        reasoning: { type: string }
        lessons: { type: string }
        label: { type: string, const: "Fictional recruiting practice—not professional experience" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, summary, jobDescription, outreach, reasoning, lessons, label, createdAt, updatedAt]
    WorkspaceKeywordHeatmapEntry:
      type: object
      properties:
        term:
          type: string
        jdCount:
          type: integer
          minimum: 1
        resumeCount:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [strong, partial, missing]
          description: strong means resumeCount is at least jdCount; partial means resumeCount is positive but lower; missing means resumeCount is zero.
      required: [term, jdCount, resumeCount, status]
    WorkspaceResumeChange:
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        why:
          type: string
      required: [before, after, why]
    WorkspaceGeneratedAnalysisRecord:
      allOf:
        - $ref: "#/components/schemas/WorkspaceRecord"
        - type: object
          properties:
            kind:
              type: string
              enum: [analysis]
            metadata:
              $ref: "#/components/schemas/WorkspaceAnalysisMetadata"
          required: [kind, metadata]
    WorkspaceGeneratedTailoredResumeRecord:
      allOf:
        - $ref: "#/components/schemas/WorkspaceRecord"
        - type: object
          properties:
            kind:
              type: string
              enum: [resume]
            metadata:
              $ref: "#/components/schemas/WorkspaceTailoredResumeMetadata"
          required: [kind, metadata]
    WorkspaceGeneratedFollowUpRecord:
      allOf:
        - $ref: "#/components/schemas/WorkspaceRecord"
        - type: object
          properties:
            kind:
              type: string
              enum: [follow-up]
            metadata:
              $ref: "#/components/schemas/WorkspaceFollowUpMetadata"
          required: [kind, metadata]
    WorkspaceGeneratedInterviewRecord:
      allOf:
        - $ref: "#/components/schemas/WorkspaceRecord"
        - type: object
          properties:
            kind:
              type: string
              enum: [interview]
            metadata:
              $ref: "#/components/schemas/WorkspaceInterviewMetadata"
          required: [kind, metadata]
    WorkspaceOtherGeneratedRecord:
      allOf:
        - $ref: "#/components/schemas/WorkspaceRecord"
        - type: object
          properties:
            kind:
              type: string
              enum: [cover-letter, linkedin]
          required: [kind]
    WorkspaceGenerationRecord:
      oneOf:
        - $ref: "#/components/schemas/WorkspaceGeneratedAnalysisRecord"
        - $ref: "#/components/schemas/WorkspaceGeneratedTailoredResumeRecord"
        - $ref: "#/components/schemas/WorkspaceGeneratedFollowUpRecord"
        - $ref: "#/components/schemas/WorkspaceGeneratedInterviewRecord"
        - $ref: "#/components/schemas/WorkspaceOtherGeneratedRecord"

