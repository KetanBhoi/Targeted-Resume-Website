openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ambassador
    description: Evidence-grounded candidate questions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ambassador/answer:
    post:
      operationId: askAmbassador
      tags: [ambassador]
      summary: Ask the candidate ambassador a question
      description: Answers using only the candidate's verified public resume facts. Chat content is not persisted or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmbassadorQuestionInput"
      responses:
        "200":
          description: Grounded answer or an unsupported-information refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmbassadorAnswer"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Ambassador temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AmbassadorQuestionInput:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 600
      required:
        - question
    AmbassadorAnswer:
      type: object
      properties:
        answer:
          type: string
        section:
          type: [string, "null"]
          enum: [about, role-fit, experience, projects, skills, education, null]
      required:
        - answer
        - section
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

