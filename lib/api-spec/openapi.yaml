openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ambassador
    description: Evidence-grounded candidate questions
  - name: workspace
    description: Private candidate workspace records and preparation tools
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ambassador/answer:
    post:
      operationId: askAmbassador
      tags: [ambassador]
      summary: Ask the candidate ambassador a question
      description: Answers using only the candidate's verified public resume facts. Chat content is not persisted or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmbassadorQuestionInput"
      responses:
        "200":
          description: Grounded answer or an unsupported-information refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmbassadorAnswer"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Ambassador temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace/records:
    get:
      operationId: listWorkspaceRecords
      tags: [workspace]
      summary: List the signed-in user's saved workspace records
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkspaceRecordKind"
      responses:
        "200":
          description: Workspace records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWorkspaceRecord
      tags: [workspace]
      summary: Save a workspace record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRecordInput"
      responses:
        "201":
          description: Saved record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecord"
        "400":
          description: Invalid record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace/records/{id}:
    patch:
      operationId: updateWorkspaceRecord
      tags: [workspace]
      summary: Update one of the signed-in user's records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRecordUpdate"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteWorkspaceRecord
      tags: [workspace]
      summary: Delete one of the signed-in user's records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Record deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace/generate:
    post:
      operationId: generateWorkspaceContent
      tags: [workspace]
      summary: Generate and save a match analysis or career preparation draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceGenerationInput"
      responses:
        "201":
          description: Generated and saved workspace record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecord"
        "400":
          description: Invalid generation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Content generation is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AmbassadorQuestionInput:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 600
      required:
        - question
    AmbassadorAnswer:
      type: object
      properties:
        answer:
          type: string
        section:
          type: [string, "null"]
          enum: [about, role-fit, experience, projects, skills, education, null]
      required:
        - answer
        - section
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    WorkspaceRecordKind:
      type: string
      enum: [resume, job, analysis, interview, cover-letter, linkedin]
    WorkspaceRecord:
      type: object
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/WorkspaceRecordKind"
        title:
          type: string
        content:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, kind, title, content, metadata, createdAt, updatedAt]
    WorkspaceRecordInput:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/WorkspaceRecordKind"
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          maxLength: 50000
        metadata:
          type: object
          additionalProperties: true
      required: [kind, title, content]
    WorkspaceRecordUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          maxLength: 50000
        metadata:
          type: object
          additionalProperties: true
    WorkspaceGenerationInput:
      type: object
      properties:
        kind:
          type: string
          enum: [analysis, interview, cover-letter, linkedin]
        title:
          type: string
          minLength: 1
          maxLength: 160
        resumeText:
          type: string
          minLength: 1
          maxLength: 20000
        jobDescription:
          type: string
          maxLength: 20000
        instructions:
          type: string
          maxLength: 2000
      required: [kind, title, resumeText]

